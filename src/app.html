<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" /><!-- no zooming: it's an app (see also touch-action in +layout.svelte) -->
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- installed to a phone's home screen: full screen, own icon -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": the app starts below the iPhone's status bar instead of
         running underneath it (on iOS 26 the area under it is blurred and its size is misreported) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Famner" />
    <meta name="theme-color" content="#1f2128" /><!-- follows the app's light/dark choice (+layout.svelte) -->
    <title>Famner</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

# /etc/nginx/sites-available/home-app — put the app behind nginx (add HTTPS here later).
#   sudo ln -s /etc/nginx/sites-available/home-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream home_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name home.local;            # the name in ORIGIN

  client_max_body_size 4m;

  # live updates (Server-Sent Events): no buffering, long-lived connections
  location ~ ^/api/(calendar|chores|lists/[^/]+)/live$ {
    proxy_pass http://home_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://home_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
